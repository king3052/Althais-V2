<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock EMR (synthetic test screens)</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--fg:#1d2733;--mut:#5f6f7f;--line:#d5dce3;--nav:#38485a;--acc:#5a2d82}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg)}
.warn{background:#fff3cd;color:#664d03;padding:6px 14px;font-weight:bold;border-bottom:1px solid #e9d38a}
.top{display:flex;align-items:center;gap:18px;background:var(--nav);color:#fff;padding:8px 14px}.top b{letter-spacing:.06em}.top span{opacity:.8}
.wrap{display:flex;height:calc(100vh - 70px)}
.side{width:300px;min-width:240px;overflow:auto;background:var(--card);border-right:1px solid var(--line)}
.side h3{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line)}
.side a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}.side a.on{background:#ece6f3;border-left:3px solid var(--acc)}
.side small{display:block;color:var(--mut)}
iframe{flex:1;border:0;background:var(--card)}
@media (max-width:700px){.wrap{flex-direction:column;height:auto}.side{width:auto}iframe{height:900px}}
</style></head>
<body>
<div class="warn">Synthetic test screens for the Althais extension. Fake patients. This is not athenahealth or any vendor's software.</div>
<div class="top"><b>MOCK EMR</b><span>Billing</span><span>Claims</span><span>Worklists</span></div>
<div class="wrap">
  <nav class="side"><h3>Claim worklist (open)</h3><div id="list"></div></nav>
  <iframe id="work" title="Claim screen" name="work"></iframe>
</div>
<script src="data.js"></script>
<script>
(function () {
  var list = document.getElementById('list'), fr = document.getElementById('work');
  var cur = new URLSearchParams(location.search).get('claimid') || MOCK_CLAIMS[0].id;
  function show(id) {
    cur = id; fr.src = 'claim.html?claimid=' + encodeURIComponent(id);
    history.replaceState(null, '', '?claimid=' + encodeURIComponent(id));
    list.querySelectorAll('a').forEach(function (a) { a.className = a.dataset.id === id ? 'on' : ''; });
  }
  MOCK_CLAIMS.forEach(function (c) {
    var a = document.createElement('a'); a.href = '#'; a.dataset.id = c.id;
    a.innerHTML = 'Claim ' + c.id + '<small></small>'; a.querySelector('small').textContent = c.note + ' · expect: ' + c.expect;
    a.onclick = function (e) { e.preventDefault(); show(c.id); };
    list.appendChild(a);
  });
  show(cur);
})();
</script>
</body></html>
