<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claim edit</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:14px 18px;font:13px/1.4 Arial,Helvetica,sans-serif;color:#1d2733;background:#fff}
.banner{display:flex;flex-wrap:wrap;gap:22px;background:#eef1f4;border:1px solid #d5dce3;padding:8px 12px;margin-bottom:14px}
.banner b{font-size:14px}
h2{font-size:15px;margin:16px 0 8px;border-bottom:2px solid #5a2d82;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 18px}
.f label{display:block;font-size:11px;color:#5f6f7f;font-weight:bold;text-transform:uppercase}
.f input,.f select{width:100%;padding:5px 6px;border:1px solid #c3ccd5;font:inherit}
table{border-collapse:collapse;width:100%;margin-top:4px}th,td{border:1px solid #d5dce3;padding:5px 7px;text-align:left}th{background:#f3f5f7;font-size:12px}
td.n{text-align:right}.btns{margin-top:16px;display:flex;gap:8px}.btns button{padding:6px 14px;border:1px solid #9aa7b4;background:#f7f7f7;font:inherit}
.empty{color:#a33;font-style:italic}
</style></head>
<body>
<div class="banner" id="banner"></div>
<h2>Claim</h2>
<div class="grid">
  <div class="f"><label for="claimno">Claim Number</label><input id="claimno" readonly></div>
  <div class="f"><label for="sdate">Service Date</label><input id="sdate"></div>
  <div class="f"><label for="ins">Primary Insurance</label><select id="ins"></select></div>
  <div class="f"><label for="prov">Rendering Provider</label><input id="prov"></div>
  <div class="f"><label for="pos">Place of Service</label><input id="pos"></div>
</div>
<h2>Diagnoses</h2>
<table id="dx"><thead><tr><th>Seq</th><th>ICD-10</th><th>Description</th></tr></thead><tbody></tbody></table>
<h2>Charges</h2>
<table id="ch"><thead><tr><th>Procedure Code</th><th>Mod 1</th><th>Mod 2</th><th>Dx Pointers</th><th>Units</th><th>Charge</th></tr></thead><tbody></tbody></table>
<div class="btns"><button type="button">Save</button><button type="button">Hold</button><button type="button" id="submit">Submit claim</button></div>
<p id="sent" style="display:none;margin-top:10px;color:#5f6f7f">Synthetic screen: nothing was sent.</p>
<script src="data.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('claimid');
  var c = MOCK_CLAIMS.filter(function (x) { return x.id === id; })[0] || MOCK_CLAIMS[0];
  var esc = function (s) { var e = document.createElement('span'); e.textContent = s == null ? '' : String(s); return e.innerHTML; };
  document.getElementById('banner').innerHTML = '<b>' + esc(c.patient) + '</b><span>DOB ' + esc(c.dob) + '</span><span>Sex F</span><span>Patient ID 9' + esc(c.id) + '</span>';
  document.getElementById('claimno').value = c.id;
  document.getElementById('sdate').value = c.dos;
  var ins = document.getElementById('ins');
  ins.innerHTML = '<option value="">(no insurance on file)</option>' + (c.payer ? '<option selected>' + esc(c.payer) + '</option>' : '');
  document.getElementById('prov').value = c.provider;
  document.getElementById('pos').value = c.pos;
  var dx = document.querySelector('#dx tbody');
  dx.innerHTML = c.dx.length ? c.dx.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('') : '<tr><td colspan="3" class="empty">No diagnoses entered</td></tr>';
  document.getElementById('submit').onclick = function () { document.getElementById('sent').style.display = 'block'; };
  document.querySelector('#ch tbody').innerHTML = c.lines.map(function (l) {
    return '<tr><td>' + esc(l[0]) + '</td><td>' + esc(l[1]) + '</td><td>' + esc(l[2]) + '</td><td>' + esc(l[3]) + '</td><td class="n">' + esc(l[4]) + '</td><td class="n">$' + Number(l[5]).toFixed(2) + '</td></tr>';
  }).join('');
})();
</script>
</body></html>
